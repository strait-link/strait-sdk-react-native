name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/spec-vectors.mjs
      - run: node scripts/brand.mjs
      - name: Build the example app against this repo (examples/expo)
        working-directory: examples/expo
        run: npm ci && npm run build
      - name: Expo config plugin output (examples/expo prebuild)
        working-directory: examples/expo
        run: npx expo prebuild --no-install && node scripts/check-prebuild.mjs
